name: tests

on:
  push:
  pull_request:

jobs:
  kiem-tu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]   # máy PC chạy Windows: bắt lỗi POSIX/Windows sớm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install fastapi httpx pytest uvicorn
      - name: Cài màn hình ảo (Linux, để chạy ca kiểm giao diện Tkinter)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - name: Chạy bộ kiểm của từng thư mục (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python kiem_tat_ca.py
      - name: Chạy bộ kiểm của từng thư mục (Windows)
        if: runner.os == 'Windows'
        run: python kiem_tat_ca.py
      - name: Tự kiểm bộ kiểm (đột biến)
        run: python kiem_tat_ca.py --tu-kiem
      - name: Chuẩn app Harness² (mọi thư mục app phải có --kiem, HELP.md, không bí mật gán cứng)
        run: python harness2-app-chuan/kiem_chuan_app.py --goc . --ra chuan-app-ci
      - name: Mỗi app tự kiểm (--kiem)
        shell: bash
        run: |
          set -e
          python drive-sync/hoc_tu_chan.py --kiem
          python sql-readonly-api/kiem_ket_noi.py --kiem
          python ton-dong/ton_dong.py --kiem
          python nhac-cat/kiem_cat_nhac.py --kiem
          python tong-hop-viec/tong_hop_viec.py --kiem
          python video-links/video_links.py --kiem
